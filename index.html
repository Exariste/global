<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
    background:rgba(0,0,0,0.7);
    z-index:1000;
}

.logo img{
    height:50px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

nav a:hover{
    color:#38bdf8;
}

/* HERO */
.hero{
    height:100vh;
    background:url('herobanner.png') center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-top:80px;
}

.hero::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.hero-content{
    position:relative;
    z-index:1;
}

.hero h1{
    font-size:48px;
}

.hero p{
    margin-top:10px;
    opacity:0.9;
}

.btn{
    margin-top:20px;
    padding:12px 25px;
    background:#38bdf8;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

/* SECTIONS */
section{
    padding:80px 50px;
    text-align:center;
}

section h2{
    margin-bottom:15px;
}

</style>
</head>

<body>

<header>
    <div class="logo">
        <img src="logo.png" alt="logo">
    </div>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero" id="home">
    <div class="hero-content">
        <h1>Welcome to Our Company</h1>
        <p>We deliver quality and trust worldwide</p>
        <button class="btn">Get Started</button>
    </div>
</section>

<!-- ABOUT -->
<section id="about">
    <h2>About Us</h2>
    <p>We are a modern corporate organization providing global solutions.</p>
</section>

<!-- SERVICES -->
<section id="services">
    <h2>Our Services</h2>
    <p>Logistics, Supply Chain, Distribution & More</p>
</section>

<!-- CONTACT -->
<section id="contact">
    <h2>Contact</h2>
    <p>Email: info@company.com | Phone: +880XXXXXXXXX</p>
</section>

</body>
</html>
