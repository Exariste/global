<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(0,0,0,0.6);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo img {
            height: 50px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        nav a:hover {
            color: #38bdf8;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            background: url('herobanner.png') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero-overlay {
            background: rgba(0,0,0,0.6);
            padding: 40px;
            border-radius: 10px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: #38bdf8;
            border: none;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        /* Section */
        section {
            padding: 80px 50px;
            text-align: center;
        }

    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero" id="home">
        <div class="hero-overlay">
            <h1>Welcome to Our Company</h1>
            <p>We deliver quality and trust worldwide</p>
            <button class="btn">Get Started</button>
        </div>
    </section>

    <!-- About -->
    <section id="about">
        <h2>About Us</h2>
        <p>We are a modern corporate organization providing global solutions.</p>
    </section>

    <!-- Services -->
    <section id="services">
        <h2>Our Services</h2>
        <p>Logistics, Supply Chain, Distribution & More</p>
    </section>

    <!-- Contact -->
    <section id="contact">
        <h2>Contact</h2>
        <p>Email: info@company.com | Phone: +880XXXXXXXXX</p>
    </section>

</body>
</html>
