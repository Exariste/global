<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Distribution House</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0b1220; /* dark navy base */
      color: #e5e7eb;
    }
  </style>
</head>

<body class="font-sans">

<!-- NAV -->
<header class="bg-[#0f172a] shadow-lg">
  <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
    
    <h1 class="text-white text-2xl font-bold">
      Global Distribution House
    </h1>

    <nav class="space-x-6 text-gray-300">
      <a href="#" class="hover:text-white">Home</a>
      <a href="#" class="hover:text-white">About</a>
      <a href="#" class="hover:text-white">Services</a>
      <a href="#" class="hover:text-white">Contact</a>
    </nav>

  </div>
</header>

<!-- HERO -->
<section class="relative h-[80vh] flex items-center justify-center text-center">

  <!-- dark overlay -->
  <div class="absolute inset-0 bg-gradient-to-b from-black/80 to-black/60"></div>

  <div class="relative z-10 max-w-3xl">
    <h2 class="text-4xl md:text-5xl font-bold text-white">
      Premium Corporate Distribution
    </h2>
    <p class="mt-4 text-gray-300">
      Reliable supply chain solutions for global business growth
    </p>

    <button class="mt-6 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">
      Get Started
    </button>
  </div>

</section>

<!-- ABOUT -->
<section class="py-16 bg-[#0f172a]">
  <div class="max-w-5xl mx-auto text-center">
    <h3 class="text-3xl font-bold text-white mb-4">About Us</h3>
    <p class="text-gray-400">
      We provide international standard distribution services with efficiency and trust.
    </p>
  </div>
</section>

<!-- FOOTER -->
<footer class="bg-black text-gray-400 text-center p-6">
  © 2026 Global Distribution House. All rights reserved.
</footer>

</body>
</html>
